# SPDX-License-Identifier: Apache-2.0
name: DCO & CLA (reusable)

# Reusable DCO and CLA checks for every repository in the organization. A repo
# calls it from a workflow named cla-dco.yml (see that file in this repo) and
# requires the checks `cla-dco / dco` and `cla-dco / cla-check`. Each repo keeps
# its own .github/CONTRIBUTORS.md. The checks skip on the merge queue, where the
# pull request already passed them, and on bot-authored pull requests.
#
# SAFETY: no job here uses pull_request_target. The two PR checks run on plain
# pull_request with read-only permissions and no checkout: they read commits
# and the base ref's CONTRIBUTORS.md through the REST API. Every untrusted value
# (login, commit message) reaches a script through `env`, never through an
# expression inside the script. The signing job lives in cla-sign.yml.
on:
  workflow_call:

permissions: {}

jobs:
  # Job keys are unique across the workflow set so check-run names stay
  # unambiguous.
  dco:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    # timeout-minutes: max(5, 3x slowest success seen); a hung job fails fast.
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Check DCO (Signed-off-by on all commits)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const missing = [];
            for (const c of commits) {
              // Skip bot-authored commits. auto-update-pr.yml,
              // dependabot, and the igorjs App create merge / sync
              // commits via the GitHub API that can't carry a
              // Signed-off-by trailer; gating on them would block
              // every PR the auto-updater touches. Mirrors Probot
              // DCO behaviour. Check both author and committer
              // because merge commits have a separate committer.
              if (c.author?.type === 'Bot' || c.committer?.type === 'Bot') {
                continue;
              }
              // Skip merge commits. A merge made through the GitHub UI
              // (or `git merge` locally) cannot carry a Signed-off-by
              // trailer, and it only combines commits that were already
              // signed off on their own PRs, so gating on it would block
              // any PR that merges the base branch back in.
              if ((c.parents?.length || 0) >= 2) {
                continue;
              }
              const msg = c.commit.message || '';
              if (!msg.includes('Signed-off-by:')) {
                missing.push(c.sha.substring(0, 7));
              }
            }

            if (missing.length > 0) {
              const text = [
                '### DCO check failed',
                '',
                'These commits are missing a `Signed-off-by` trailer: ' + missing.join(', '),
                '',
                'Amend them with `git commit --amend --signoff` (or `git rebase --signoff`) and push again.',
              ].join('\n');
              await core.summary.addRaw(text + '\n', true).write();
              core.setFailed('DCO: missing Signed-off-by on ' + missing.join(', '));
            } else {
              core.info('DCO: every commit is signed off');
            }

  cla-check:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Check CLA signature (default branch, no checkout)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        with:
          script: |
            const CLA_DOCS = 'https://github.com/pragmatic-engineer/playbook/blob/main/.github';
            const author = process.env.PR_AUTHOR.toLowerCase();
            let file;
            try {
              ({ data: file } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/CONTRIBUTORS.md',
                ref: process.env.BASE_BRANCH,
              }));
            } catch (err) {
              if (err.status === 404) {
                core.setFailed('CLA: .github/CONTRIBUTORS.md is missing on ' + process.env.BASE_BRANCH + '. Add it in a separate pull request first.');
                return;
              }
              throw err;
            }
            const content = Buffer.from(file.content, 'base64').toString('utf-8');

            // Parse table rows between CLA-BOT markers
            const match = content.match(/CLA-BOT:START[\s\S]*?CLA-BOT:END/);
            const hasSigned = match
              ? match[0].toLowerCase().split('\n').some(l => /^\|\s*@([^\s|]+)\s*\|/.exec(l.trim())?.[1] === author)
              : false;

            if (!hasSigned) {
              const text = [
                '### CLA not signed',
                '',
                '@' + author + ', sign the Individual CLA (' + CLA_DOCS + '/ICLA.md) before this PR can be merged.',
                'Reply to this PR with: `I have read the CLA Document and I hereby sign the CLA.`',
                'Then push a new commit, or ask a maintainer to re-run this check. For an employer, see ' + CLA_DOCS + '/CCLA.md.',
              ].join('\n');
              await core.summary.addRaw(text + '\n', true).write();
              core.setFailed('CLA: @' + author + ' has not signed');
            } else {
              core.info('CLA: @' + author + ' has signed');
            }
