name: CLA & DCO

# Calls the shared checks in dco-cla.yml. Other repos copy this file and call
# `pragmatic-engineer/.github/.github/workflows/dco-cla.yml@main` instead of the
# local path. The job id must stay `cla-dco` so the required checks read
# `cla-dco / dco` and `cla-dco / cla-check` in every repo.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cla-dco:
    if: github.event_name != 'issue_comment'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/dco-cla.yml

  cla-sign:
    if: github.event_name == 'issue_comment'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/dco-cla.yml
